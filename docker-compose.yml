services:
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: vn-dbpedia-fuseki
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: admin
      FUSEKI_DATASET_1: vndbpedia
    volumes:
      - ./data/final:/staging
      - fuseki-data:/fuseki
    restart: unless-stopped

volumes:
  fuseki-data:
